<!-- RELO lockup: the mark, the relo wordmark and the by-WKT signature. Every
     part sits on its own node so each can arrive on its own, and four details
     of that arrangement are load-bearing.

     The seam is the mark's hypotenuse as a drawable <line> with pathLength=1,
     so a single dashoffset 1 -> 0 draws it at whatever size it renders, and it
     runs bottom-left to top-right: the brand's motion vector, which nothing in
     a RELO film moves against.

     The bloom circle sits on the exact point the three primitives share, so a
     clip on it opens the mark outward from its own corner rather than fading it
     in. userSpaceOnUse, so the coordinates are the viewBox's and there is no
     box-model guessing.

     No animated node carries a transform attribute of its own. GSAP folds an
     element's existing SVG transform into the x/y/scale it is about to
     overwrite, so a tween on a group that carried translate(733,110) would
     fling it to the origin. The positioning translate therefore lives on a
     parent and the potrace flip on the child <path>; the animated groups
     between them start clean.

     The top-right square is --accent, where logo/mark.svg has it white: on a
     light ground a white square reads as absence, and the intro is the one
     place the mark states all three brand colours at once. Everything else is
     token-bound, so dropping this on .s-navy reverses it with no second file.
     Ids are prefixed -- two lockups on one frame must re-prefix, clip id
     included, or the second one's bloom drives the first one's clip.

     The viewBox is the lockup's own bounds plus 80 units of margin on every
     side, and the margin is the entrance's, not taste. Measured: the lockup
     rests at x 44..1856, y 119..792, and the pop's widest moment is the o at
     scaleX 1.4, which reaches x 1926 -- 70 units past the resting bounds. An
     exact crop clips it, and a viewBox is a clipping container, so the film
     that inlines this gets a container_overflow finding for every frame of
     the pop rather than a picture of the problem. -->

    <clipPath id="relo-lockup-bloom" clipPathUnits="userSpaceOnUse">

    </clipPath>
  </defs>
  <line id="relo-lockup-seam" x1="44" y1="348.5" x2="273.5" y2="119" pathLength="1"
        fill="none" stroke="var(--onGround)" stroke-width="16" stroke-dasharray="1" stroke-dashoffset="1"/>
  <g id="relo-lockup-icon" clip-path="url(#relo-lockup-bloom)">

    <rect x="273.5" y="119" width="229.5" height="229.5" fill="var(--accent)"/>
