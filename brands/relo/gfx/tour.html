<style>
  /* THE WORLD. The product is laid out for a 1280x720 browser viewport and the
     film shows it at 1.5x, which fills 1920x1080 exactly. A beat reframes by
     transforming this, never #cam, so the editorial layer above is never
     scaled. transform-origin 0 0 makes the framing arithmetic a translate: to
     put screen point p at the frame centre at scale s, x = 960 - s*px, and the
     clamp that keeps the world covering the frame is x in [1920 - 1280s, 0]. */
  #wr { position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
        transform-origin: 0 0; transform: translate(0px, 0px) scale(1.5) }

  /* Every screen a beat carries is stacked at 0,0 and switched. The one the
     beat opens on is turned back on by the beat's own style, by id, so a cold
     seek to the beat's first frame paints a complete screen with no tween.
     The resting state is hidden BOTH ways, and the one the beat opens on gets
     visibility: inherit, never visible. The runtime hides a clip outside its
     window by writing visibility:hidden on the host, and a descendant that
     declares itself visible defeats that; inherit follows the host instead.
     Hidden, not merely transparent, because gate 2 measures the box of every
     text block that is not display:none, visibility:hidden or itself under
     0.05 opacity, and nine stacked screens at opacity 0 are nine screens of
     type it would read as colliding. */
  .dsh { opacity: 0; visibility: hidden }

  /* THE POINTER, in screen pixels rather than frame pixels, so it grows with a
     zoom exactly as a cursor does in a screen recording. Its tip is the path's
     first point, so a move targets the thing the tip must land on. */
  #cur { position: absolute; left: 0; top: 0; width: 21px; height: 30px; z-index: 92;
         opacity: 0; visibility: hidden; pointer-events: none;
         filter: drop-shadow(0 1px 2px rgba(10, 16, 32, 0.4)) }

  /* THE HOVER MARK. A control the pointer has reached gets an outline and a
     wash, which is what a hover state reads as; the film never invents a
     control the product does not have. Size is set, never tweened: width and
     height reflow, and a reflow snaps to device pixels under a seek-by-frame
     capture. */
  #ring { position: absolute; left: 0; top: 0; width: 10px; height: 10px; z-index: 90;
          border: 2px solid #1b88ef; border-radius: 6px;
          background: rgba(27, 136, 239, 0.1);
          box-shadow: 0 0 0 3px rgba(27, 136, 239, 0.14);
          opacity: 0; visibility: hidden; pointer-events: none }

  /* THE CLICK. One ring out of the tip, and nothing else. */
  #tap { position: absolute; left: 0; top: 0; width: 24px; height: 24px;
         margin: -12px 0 0 -12px; z-index: 91;
         border: 2px solid rgba(27, 136, 239, 0.9); border-radius: 50%;
         opacity: 0; visibility: hidden; pointer-events: none }
</style>
<div id="ring"></div>
<div id="tap"></div>
