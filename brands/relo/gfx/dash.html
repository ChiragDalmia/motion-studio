<style>
.dsh{
  --d-bg:#f5f5f5; --d-surface:#fff; --d-surface-2:#fafafa; --d-surface-3:#f0f0f0;
  --d-border:#e0e0e0; --d-border-soft:#eeeeee; --d-border-strong:#cfcfcf;
  --d-text:#1f1f1f; --d-text-2:#3d3d3d; --d-muted:#6e6e6e; --d-muted-2:#9e9e9e;

  --d-blue:#1b88ef;           /* filled primary buttons        */
  --d-blue-600:#0f69cf;       /* FAB, strong fills, meters     */
  --d-blue-700:#1565c0;
  --d-blue-050:#e8f3fe;
  --d-nav-active:#b0d8fa;     /* selected sidebar row          */
  --d-navy:#263e93;           /* help popovers, Riley, chips   */
  --d-navy-deep:#16205a;
  --d-slate:#434b57;

  --d-green:#2e7d32; --d-green-line:#3e8e6d; --d-green-bg:#e5f1e5;
  --d-correct-bg:#d4f6e3; --d-proficient:#1d6931;
  --d-purple:#8c74cb; --d-interm:#3098ee; --d-unknown:#d9d9d9;
  --d-red:#f8335b; --d-red-play:#e5433c; --d-orange:#ef9a2e; --d-cyan:#1ba6f6;

  --d-radius:8px; --d-radius-sm:6px; --d-radius-pill:999px;
  --d-shadow:0 1px 2px rgba(0,0,0,.05);
  --d-shadow-2:0 2px 8px rgba(0,0,0,.10);
  --d-shadow-3:0 8px 28px rgba(0,0,0,.22);

  --d-sidebar-w:240px; --d-topbar-h:48px; --d-footer-h:26px;
  
}

.dsh, .dsh *,.dsh *::before,.dsh *::after{box-sizing:border-box}
.dsh,.dsh{margin:0;padding:0}
.dsh{font-family: var(--ui);background:var(--d-bg);color:var(--d-text);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
.dsh svg{display:block}
.dsh a{color:var(--d-blue-700);text-decoration:none}
.dsh button{font:inherit;color:inherit;background:none;border:0;padding:0}

/* ---------- app shell ---------- */
.dsh .app{display:flex;min-height:720px}
.dsh .sidebar{width:var(--d-sidebar-w);flex:0 0 var(--d-sidebar-w);background:var(--d-surface);
  border-right:1px solid var(--d-border);display:flex;flex-direction:column;
  position:sticky;top:0;height:720px;z-index:30}
.dsh .brand{height:var(--d-topbar-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 0 16px;flex:0 0 var(--d-topbar-h)}
.dsh .brand-mark{display:flex;align-items:flex-start;gap:7px}
.dsh .brand-collapse{color:#2b2b2b;cursor:pointer}
.dsh .nav{padding:4px 0 0;display:flex;flex-direction:column}
.dsh .nav-item{display:flex;align-items:center;gap:16px;height:33px;padding:0 16px;
  color:#2b2b2b;font-size:13.5px;cursor:pointer}
.dsh .nav-item .ico{color:#2b2b2b;flex:0 0 20px}
.dsh .nav-item:hover{background:#f4f4f4}
.dsh .nav-item.is-active{background:var(--d-nav-active)}
.dsh .nav-item.is-active .lbl{color:#12263a}

.dsh .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.dsh .topbar{height:var(--d-topbar-h);flex:0 0 var(--d-topbar-h);background:var(--d-surface);
  border-bottom:1px solid var(--d-border);display:flex;align-items:center;gap:14px;
  padding:0 16px 0 20px;position:sticky;top:0;z-index:25}
.dsh .course-pick{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;
  color:#1b1b1b;cursor:pointer;white-space:nowrap}
.dsh .topbar-spacer{flex:1 1 auto}
.dsh .search{display:flex;align-items:center;gap:8px;width:224px;height:30px;padding:0 10px 0 14px;
  border:1px solid var(--d-border);border-radius:var(--d-radius-pill);background:var(--d-surface);
  color:var(--d-muted);font-size:13px}
.dsh .search .txt{flex:1 1 auto}
.dsh .days-pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;
  border:1px solid var(--d-border);border-radius:var(--d-radius-pill);cursor:pointer}
.dsh .days-pill .n{font-size:16px;font-weight:500;color:#1b1b1b;line-height:1}
.dsh .days-pill .lbl{font-size:7.5px;font-weight:700;letter-spacing:.3px;color:#3d3d3d;
  line-height:1.15;text-transform:uppercase}
.dsh .theme-toggle{color:#1b1b1b;cursor:pointer;padding:2px}
.dsh .avatar{width:32px;height:32px;border-radius:50%;background:#0f69cf;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;
  font-weight:500;letter-spacing:.4px;cursor:pointer}

.dsh .content{flex:1 1 auto;background:var(--d-bg);padding:16px 16px calc(var(--d-footer-h) + 26px)}
.dsh .footer{position: absolute;left:0;right:0;bottom:0;height:var(--d-footer-h);background:var(--d-bg);
  display:flex;align-items:center;gap:14px;padding:0 14px;
  font-size:10.5px;color:#8a8a8a;z-index:34}
.dsh .footer .sep{width:1px;height:11px;background:#d0d0d0}
.dsh .footer .grow{flex:1 1 auto}
.dsh .footer .fb{display:flex;align-items:center;gap:6px;color:#1565c0;font-size:11px}
.dsh .footer .fb .box{width:12px;height:12px;border-radius:2px;background:var(--d-blue);color:#fff;
  font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dsh .fab{position: absolute;right:22px;bottom:44px;width:44px;height:44px;border-radius:50%;
  background:var(--d-blue-600);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:7.5px;font-weight:700;
  line-height:1.15;letter-spacing:.2px;box-shadow:var(--d-shadow-2);cursor:pointer;z-index:29}

/* ---------- cards ---------- */
.dsh .card{background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--d-radius);
  box-shadow:var(--d-shadow)}
.dsh .card-head{padding:13px 18px 12px}
.dsh .card-head.divided{border-bottom:1px solid var(--d-border-soft)}
.dsh .card-title{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;
  letter-spacing:-.2px;color:#141414;line-height:1.2}
.dsh .card-sub{margin-top:3px;font-size:12px;color:var(--d-muted)}
.dsh .card-body{padding:16px 18px}
.dsh .grid-2{display:grid;grid-template-columns:5fr 7fr;gap:14px;align-items:start}
.dsh .stack{display:flex;flex-direction:column;gap:14px}

/* ---------- buttons ---------- */
.dsh .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:30px;
  padding:0 13px;border-radius:4px;font-size:11.5px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;cursor:pointer;white-space:nowrap}
.dsh .btn-filled{background:var(--d-blue);color:#fff;box-shadow:var(--d-shadow)}
.dsh .btn-navy{background:var(--d-navy);color:#fff;box-shadow:var(--d-shadow)}
.dsh .btn-outline{border:1px solid var(--d-blue);color:var(--d-blue-700);background:var(--d-surface)}
.dsh .btn-outline-green{border:1px solid var(--d-green-line);color:var(--d-green-line);background:var(--d-surface)}
.dsh .btn-grey{background:#8e9aa0;color:#fff}
.dsh .btn-sm{height:26px;padding:0 10px;font-size:10.5px}
.dsh .btn-text{color:var(--d-blue-700);font-size:12px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;cursor:pointer}
.dsh .help-dot{width:17px;height:17px;border-radius:50%;border:1.4px solid #8d8d8d;color:#8d8d8d;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:700;cursor:pointer;flex:0 0 17px}

/* ---------- misc primitives ---------- */
.dsh .meta-row{display:flex;align-items:center;gap:18px;font-size:12px;color:var(--d-muted);margin-top:6px}
.dsh .meta{display:flex;align-items:center;gap:6px}
.dsh .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}
.dsh .divider{height:1px;background:var(--d-border-soft)}
.dsh .tabs{display:flex;border-bottom:1px solid var(--d-border-soft)}
.dsh .tab{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;
  font-size:13px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;
  color:var(--d-muted-2);cursor:pointer;border-bottom:2px solid transparent}
.dsh .tab.is-active{color:var(--d-blue-700);border-bottom-color:var(--d-blue-700)}
.dsh .scrim{position: absolute;inset:0;background:rgba(0,0,0,.5);z-index:40}
.dsh .sheet{position: absolute;z-index:41;background:var(--d-surface);border-radius:4px;
  box-shadow:var(--d-shadow-3)}

.dsh .brand-word{display:flex;flex-direction:column;line-height:1}
.dsh .brand-tile{flex:0 0 auto;margin-top:3.5px}
.dsh .brand-relo{font-size:22px;font-weight:800;letter-spacing:-1px;color:#051047}
.dsh .brand-by{font-size:6px;font-weight:500;letter-spacing:.1px;color:#051047;
  align-self:flex-end;margin-top:2px}
.dsh .brand-by b{font-weight:800;letter-spacing:.3px}

.dsh .sn-item{border:1px solid var(--d-border);border-radius:var(--d-radius-sm);padding:9px 12px 10px;
  background:var(--d-surface);display:flex;flex-direction:column;gap:2px}
.dsh .sn-item + .sn-item{margin-top:10px}
.dsh .sn-eyebrow-lesson{color:#2f9bf0}
.dsh .sn-eyebrow-levelup{color:#4aa07c}
.dsh .sn-name{font-size:14px;font-weight:500;color:#1b1b1b;letter-spacing:-.1px}
.dsh .sn-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:3px}
.dsh .sn-meta{display:flex;align-items:center;gap:16px;font-size:11.5px;color:#7a7a7a}
.dsh .sn-meta .meta{gap:5px}

.dsh .pace-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:34px 20px 36px;text-align:center}
.dsh .hero-disc{width:66px;height:66px;border-radius:50%;background:var(--d-blue-600);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--d-shadow)}
.dsh .hero-disc svg{width:34px;height:34px}
.dsh .pace-lines{font-size:13.5px;color:#2b2b2b;line-height:1.85}
.dsh .pace-lines a{font-weight:500}
.dsh .pace-tabs{display:flex;border-bottom:1px solid var(--d-border-soft)}
.dsh .pace-tab{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:9px;height:44px;
  font-size:12.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:#a3a3a3;cursor:pointer;border-bottom:2px solid transparent}
.dsh .pace-tab.is-active{color:var(--d-blue-700);border-bottom-color:var(--d-blue-700)}
.dsh .pace-tab.is-active.filled{background:#e9f2fd}
.dsh .pace-note{text-align:center;font-size:13px;color:#2b2b2b;padding:14px 16px 12px}
.dsh .pace-rows{display:flex;flex-direction:column;gap:12px;padding:0 18px 4px}
.dsh .pace-row{display:flex;align-items:center;gap:14px}
.dsh .pace-row .lab{width:118px;flex:0 0 118px;font-size:15px;font-weight:700;color:#141414}
.dsh .pace-bar{flex:1 1 auto;height:27px;border-radius:3px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.dsh .pace-bar.blue{background:#bfd7ef}.dsh .pace-bar.green{background:#c3d3c6}
.dsh .pace-bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--d-blue)}
.dsh .pace-bar .chip{position:relative;background:#fff;border-radius:3px;padding:1px 9px;
  font-size:11.5px;color:#2b2b2b}
.dsh .pace-aside{width:112px;flex:0 0 112px;display:flex;align-items:center;justify-content:center;
  height:42px;border:1px solid var(--d-border);border-radius:var(--d-radius-pill);
  font-size:10px;font-weight:700;letter-spacing:.3px;text-align:center;line-height:1.2;
  text-transform:uppercase;color:#2b2b2b;gap:6px}
.dsh .pace-aside .big{font-size:19px;font-weight:500;letter-spacing:0;text-transform:none}
.dsh .pace-insights{padding:14px 18px 16px;border-top:1px solid var(--d-border-soft);margin-top:12px}
.dsh .pace-insights h4{margin:0 0 9px;font-size:13px;font-weight:700;color:#141414}
.dsh .pace-rec{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#3d3d3d;flex-wrap:wrap}
.dsh .tagchip{border-radius:3px;padding:2px 8px;font-size:11.5px;font-weight:600}
.dsh .tagchip.blue{background:#dceafb;color:#14538f}
.dsh .tagchip.green{background:#d8ecd9;color:#1d6931}

.dsh .rr-head{display:flex;align-items:center;gap:12px;background:#f3f3f3;padding:12px 16px;
  border-bottom:1px solid var(--d-border-soft);border-radius:8px 8px 0 0}
.dsh .rr-head .txt{flex:1 1 auto}
.dsh .rr-disc{width:30px;height:30px;border-radius:50%;background:var(--d-blue-600);
  display:flex;align-items:center;justify-content:center}
.dsh .rr-disc .sq{width:14px;height:14px;border-radius:2px;background:#fff;color:#0f69cf;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dsh .rr-body{padding:13px 16px 16px}
.dsh .rr-msg{font-size:16px;font-weight:700;color:#1b88ef;letter-spacing:-.2px}
.dsh .rr-scale{display:flex;gap:2px;margin-top:11px}
.dsh .rr-step{flex:1 1 0;height:27px;background:#bdbdbd;color:#e3e3e3;font-size:11px;
  display:flex;align-items:center;justify-content:center}
.dsh .rr-step.on{background:var(--d-blue);color:#fff;border-radius:4px}
.dsh .rr-step:first-child{border-radius:4px 0 0 4px}
.dsh .rr-step:last-child{border-radius:0 4px 4px 0}
.dsh .rr-guide{margin-top:12px;font-size:12.5px;color:#4a4a4a;line-height:1.6}

.dsh .cm-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:34px 20px 36px;text-align:center}
.dsh .cm-tabs{display:flex;border-bottom:1px solid var(--d-border-soft)}
.dsh .cm-tab{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:9px;height:44px;
  font-size:12.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:#a3a3a3;cursor:pointer;border-bottom:2px solid transparent}
.dsh .cm-tab.is-active{color:var(--d-blue-700);border-bottom-color:var(--d-blue-700)}
.dsh .cm-grid-wrap{display:flex;gap:26px;padding:18px 18px 20px;align-items:flex-start}
.dsh .cm-left{flex:1 1 auto;min-width:0}
.dsh .cm-squares{display:grid;grid-template-columns:repeat(13,1fr);gap:6px;max-width:368px}
.dsh .cm-sq{aspect-ratio:1/1;border-radius:2px;background:var(--d-unknown)}
.dsh .cm-sq.basic{background:var(--d-purple)}
.dsh .cm-sq.interm{background:var(--d-interm)}
.dsh .cm-sq.prof{background:var(--d-proficient)}
.dsh .cm-hint{margin-top:14px;font-size:13px;color:#2b2b2b;line-height:1.5;max-width:368px}
.dsh .cm-legend-t{font-size:13.5px;font-weight:500;color:#2b2b2b;text-align:center;margin-bottom:12px}
.dsh .cm-legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.dsh .cm-leg{display:flex;align-items:center;gap:9px;font-size:13px;color:#2b2b2b}
.dsh .cm-leg svg{width:15px;height:15px}

.dsh .donut-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px}
.dsh .donut{position:relative;width:208px;height:208px}
.dsh .donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.dsh .donut .pct{font-size:37px;font-weight:700;letter-spacing:-1.4px;color:#111;line-height:1}
.dsh .donut .pct sup{font-size:15px;font-weight:500;letter-spacing:0;top:-.85em;margin-left:1px}
.dsh .donut .cap{font-size:11px;letter-spacing:2.6px;color:#6e6e6e;margin-top:4px}
.dsh .donut-next{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;
  font-style:italic;color:#2b2b2b}
.dsh .donut-next svg{width:15px;height:15px;color:var(--d-purple)}
.dsh .ms-legend{display:flex;align-items:center;gap:16px;padding:14px 16px 16px}
.dsh .ms-legend .ttl{font-size:12.5px;color:#4a4a4a;width:62px;flex:0 0 62px;line-height:1.3}
.dsh .ms-legend .grid{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.dsh .ms-legend .row{display:flex;align-items:center;gap:7px;font-size:12px;color:#2b2b2b}
.dsh .ms-legend .row svg{width:13px;height:13px}

.dsh .lu-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 18px 10px}
.dsh .lu-tile{border:1px solid var(--d-border);border-radius:var(--d-radius);padding:16px 14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:12px}
.dsh .lu-bar{width:74px;border-radius:5px;background:var(--d-cyan);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;
  font-weight:500}
.dsh .lu-bar .done{position:absolute;left:0;right:0;bottom:0;background:var(--d-green)}
.dsh .lu-cap{font-size:10.5px;color:#5c5c5c;text-decoration:underline;text-underline-offset:2px}
.dsh .lu-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:34px;
  padding:0 18px;border-radius:5px;font-size:15px;font-weight:600;letter-spacing:-.1px}
.dsh .lu-btn.filled{background:var(--d-navy);color:#fff;box-shadow:var(--d-shadow)}
.dsh .lu-btn.outline{border:1px solid #63b0f2;color:var(--d-blue);background:#fff}
.dsh .lu-legend{display:flex;align-items:center;justify-content:center;gap:26px;
  padding:6px 18px 14px;border-top:1px solid var(--d-border-soft);margin-top:6px}
.dsh .lu-leg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#3d3d3d}
.dsh .lu-swatch{width:11px;height:11px;border-radius:2px}

.dsh .prep-body{padding:14px 18px 16px}
.dsh .prep-lead{font-size:12.5px;color:#5c5c5c;line-height:1.5;margin-bottom:14px}
.dsh .prep-chips{display:flex;gap:11px;flex-wrap:wrap}
.dsh .chip-btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;
  border:1px solid var(--d-border);border-radius:var(--d-radius-pill);background:#fff;
  font-size:12.5px;color:#2b2b2b}
.dsh .chip-btn svg{width:15px;height:15px;color:#6e6e6e}
.dsh .me-empty{display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:26px 20px 30px;text-align:center}
.dsh .me-disc{width:62px;height:62px;border-radius:50%;background:var(--d-red);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--d-shadow)}
.dsh .me-disc svg{width:32px;height:32px}
.dsh .me-txt{font-size:13.5px;color:#2b2b2b;line-height:1.55;max-width:250px}

.dsh .lg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:13px 18px 12px;border-bottom:1px solid var(--d-border-soft)}
.dsh .lg-title{font-size:18px;font-weight:700;color:#141414;letter-spacing:-.2px}
.dsh .lg-rows{display:flex;flex-direction:column}
.dsh .lg-row{display:flex;align-items:center;gap:13px;padding:0 18px;height:33px;
  border-bottom:1px solid #f1f1f1;font-size:13px;color:#2b2b2b}
.dsh .lg-row:last-child{border-bottom:0}
.dsh .lg-row .pl{color:var(--d-red-play);flex:0 0 17px}
.dsh .lg-row .nm{flex:1 1 auto;font-weight:500}
.dsh .lg-row .ct{font-size:12px;color:#8a8a8a}
.dsh .lg-row .ct.partial{color:var(--d-orange)}

.dsh .cat-top{padding:14px 18px 16px}
.dsh .cat-lead{font-size:13px;color:#4a4a4a}
.dsh .cat-stats{display:flex;gap:44px;margin-top:12px}
.dsh .cat-stat .n{font-size:21px;font-weight:700;color:#141414;letter-spacing:-.5px;line-height:1}
.dsh .cat-stat .l{font-size:9.5px;font-weight:600;letter-spacing:.8px;color:#6e6e6e;
  text-transform:uppercase;margin-top:4px}
.dsh .cat-group-h{display:flex;align-items:center;gap:10px;padding:11px 18px;
  border-bottom:1px solid var(--d-border-soft);font-size:15px;font-weight:700;color:#141414}
.dsh .cat-group-h svg{width:17px;height:17px;color:#3d3d3d}
.dsh .cat-group-h:only-child{border-bottom:0;padding-bottom:13px}
