<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  /* .s-navy, because this beat sits on the host's navy. Without it the beat
     inherits the DEFAULT surface — white ground, navy ink — and the headline
     renders navy on navy: invisible, and check's contrast audit passes it,
     because the audit resolves the background from the sub-composition's own
     declared ground and never sees what the host actually paints. A beat
     states the surface it sits on. Always. */
  #root { position: relative }

  /* The mono role. A clause number is a reference, not prose: it is set in
     Roboto Mono at the pack's minTypePx floor of 24px, which is why this brand
     raised that floor from relo's 20. */
  #clause {
    position: absolute; left: 160px; top: 300px;
    font-family: var(--mono);
    font-weight: 500; font-size: 30px; letter-spacing: 0.04em;
    color: var(--brand);
    clip-path: inset(0 100% 0 0);
  }
  #head {
    position: absolute; left: 160px; top: 372px; width: 1440px;
    font-family: var(--display); font-weight: 700; font-size: 104px; line-height: 1.04;
    letter-spacing: -0.02em; color: var(--onGround); margin: 0;
    clip-path: inset(0 100% 0 0);
  }
  #body {
    position: absolute; left: 164px; top: 664px; width: 1180px;
    font-family: var(--text); font-weight: 400; font-size: 40px; line-height: 1.4;
    color: var(--muted); margin: 0;
  }
  #tab { position: absolute; left: 0; top: 288px; width: 12px; height: 480px; background: var(--brand); transform-origin: 50% 0% }
</style>
</head>
<body>
<div id="root" class="s-navy" data-composition-id="b2" data-width="1920" data-height="1080" data-duration="4">
  <div id="tab" class="clip" data-start="0" data-duration="4" data-track-index="1"></div>
  <div id="clause" class="clip" data-start="0" data-duration="4" data-track-index="2">WHMIS 2015 &middot; s. 13(1)</div>
  <h2 id="head" class="clip" data-start="0" data-duration="4" data-track-index="3">Every worker who handles a controlled product.</h2>
  <p id="body" class="clip" data-start="0" data-duration="4" data-track-index="4">Not just supervisors. Not just new hires. Everyone, every year.</p>
</div>
<script>
  /* Verb: clipped wipe against a fixed tab. Different verb from b1's settle,
     and the tab gives the wipe something to start from rather than an edge. */
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  t.addLabel('in', 0);
  /* The tab draws across the WHOLE beat, not in 0.44s. check's keepsMoving
     assertion caught this beat holding perfectly still for 3.6s once its text
     had landed — a four-second beat with 1.4s of movement reads as a stall, not
     as a considered hold. A slow continuous rule beside copy that is meant to
     be read is the right answer for this brand rather than a faster entrance. */
  t.fromTo('#tab', { scaleY: 0 }, { scaleY: 1, duration: 3.52, ease: 'power1.out' }, 'in');
  t.fromTo('#clause', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.44 }, 'in+=0.22');
  t.fromTo('#head', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.88, ease: 'power4.out' }, 'in+=0.35');
  /* Cascade decay 0.74 for this pack: 0.88 -> 0.65. Slower and less aggressive
     than relo's 0.62, and the difference is audible in the film. */
  t.fromTo('#body', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.65, ease: 'power3.out' }, 'in+=0.79');
  window.__timelines['b2'] = t;
</script>
</body>
</html>
