<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  /* The alert band. Only white clears this red and the pack's `alert` surface
     already encodes that, so this file names no colour. */
  #root { position: relative }
  #band { position: absolute; inset: 0; background: var(--ground); transform-origin: 50% 50% }
  /* 132px over 1600px wraps this line to two; at 148px it wrapped to three and
     ran into #sub, which check caught as content_overlap. The subhead sits
     below the wrapped block, not below one line of it. */
  #warn {
    position: absolute; left: 160px; top: 372px; width: 1600px;
    font-family: var(--display); font-weight: 700; font-size: 132px; line-height: 1.02;
    letter-spacing: -0.03em; color: var(--onGround); margin: 0;
  }
  #sub {
    position: absolute; left: 164px; top: 700px;
    font-family: var(--text); font-weight: 500; font-size: 42px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="root" class="s-alert" data-composition-id="b3" data-width="1920" data-height="1080" data-duration="3.5">
  <div id="band" class="clip" data-start="0" data-duration="3.5" data-track-index="1"></div>
  <h2 id="warn" class="clip" data-start="0" data-duration="3.5" data-track-index="2">Expired training is unticketed work.</h2>
  <div id="sub" class="clip" data-start="0" data-duration="3.5" data-track-index="3">One inspection is all it takes.</div>
</div>
<script>
  /* Verb: hard cut on a full-frame scale. The band arrives in 0.22s — a quarter
     of the beat — because this is the only place in the film that interrupts.
     Velocity-matched to nothing: that is what makes it a cut. */
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  t.addLabel('in', 0);
  t.fromTo('#band', { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: 'power2.in' }, 'in');
  t.fromTo('#warn', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.44 }, 'in+=0.22');
  t.fromTo('#sub', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.33 }, 'in+=0.4');
  window.__timelines['b3'] = t;
</script>
</body>
</html>
