<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  /* The editorial layer for the 4:5 frame: the same four lines at the same
     times, sized so nothing sets below 44 frame px (16 CSS px at a 390px view). */
  #root { position: relative; background: transparent }
  .line { position: absolute; font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; color: var(--onGround); margin: 0; clip-path: inset(0 100% 0 0) }
  /* Beside the learner, who is centred: two lines in the space to their left. */
  #q { left: 60px; top: 420px; font-size: 96px; line-height: 1.0 }
  #n { left: 96px; top: 40px; font-size: 72px; line-height: 1.1 }
  #u { left: 96px; top: 52px; font-size: 52px; line-height: 1.1 }
  #c { left: 96px; top: 60px; font-size: 72px; line-height: 1.1 }
</style>
</head>
<body>
<div id="root" data-composition-id="copy" data-width="1080" data-height="1350" data-duration="43">
  <h2 id="q" class="line clip" data-start="0.3"  data-duration="4.2"  data-track-index="1">Am I<br>ready?</h2>
  <h2 id="n" class="line clip" data-start="6.4"  data-duration="5.9"  data-track-index="2">Your next step.</h2>
  <h2 id="u" class="line clip" data-start="17.9" data-duration="5.55" data-track-index="3">Understand why.</h2>
  <h2 id="c" class="line clip" data-start="31.9" data-duration="5.1"  data-track-index="4">A clearer way forward.</h2>
</div>
<script>
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power4.out', immediateRender: false } });
  t.addLabel('in', 0);
  t.fromTo('#q', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.52 }, 'in+=0.3');
  t.fromTo('#q', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in' }, 'in+=4.1');
  t.fromTo('#n', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.52 }, 'in+=7.7');
  t.fromTo('#n', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in' }, 'in+=10.0');
  t.fromTo('#u', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.44 }, 'in+=17.9');
  t.fromTo('#u', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in' }, 'in+=21.1');
  t.fromTo('#c', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.52 }, 'in+=31.9');
  t.fromTo('#c', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in' }, 'in+=34.7');
  window.__timelines['copy'] = t;
</script>
</body>
</html>
