<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  #root { position: relative; background: transparent; overflow: hidden }
  /* Capture space (1600x1000) under a 4:5 frame. F0m, the landing the desk
     beat's move ends in, is 1.35 at (-18, 0): the dashboard's left 800px --
     top bar, sidebar, Study Navigator, ReadyRating -- filling the frame. */
  #stage { position: absolute; inset: 0; overflow: hidden }
  #w { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; overflow: hidden; transform-origin: 0 0; transform: translate(-18px, 0px) scale(1.35); border-radius: 6px; box-shadow: 0 18px 50px rgba(5,16,71,0.14) }
  .shot { position: absolute; background-repeat: no-repeat; background-size: 100% 100% }
  .base { left: 0; top: 0; width: 1600px; height: 1000px }
  .hid { opacity: 0; visibility: hidden }
  #s01 { background-image: var(--img-s01) }
  #s03 { background-image: var(--img-s03) }
  #hP { left: 660px; top: 352px; width: 140px; height: 66px; background-image: var(--img-h-practice) }
  /* 44 frame px tall at the Study Navigator zoom (2.05), tip at (2,2). */
  #cur { position: absolute; left: 0; top: 0; width: 20px; height: 29px; transform-origin: 2px 2px; transform: translate(858px, 558px) scale(0.74); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)) }
</style>
</head>
<body>
<div id="root" data-composition-id="dash" data-width="1080" data-height="1350" data-duration="5.5">
  <div id="stage" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
    <div id="w" data-layout-allow-overflow>
      <div id="s01" class="shot base" role="img" aria-label="RELO dashboard, day one: Study Navigator recommends practice questions to develop mastery, 20 to 30 minutes, 0 of 20 questions"></div>
      <div id="hP" class="shot hid"></div>
      <div id="s03" class="shot base hid" role="img" aria-label="Fundamentals of Real Estate Adaptive Quiz, question 1 of 12"></div>
      <svg id="cur" class="hid" viewBox="0 0 20 29" aria-hidden="true"><path d="M1.6 1.2 L1.6 24.3 L7.3 18.8 L11 27.4 L14.6 25.8 L11 17.4 L18.6 17 Z" fill="#111" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script>
  /* Same events and times as the desktop beat. F1m frames the Study Navigator
     card tightly (2.05 at -598,150) with a 150px band above for the editorial
     line; F2m (2.0 at -80,-125) is the quiz's reading frame: the question's
     start, all four answers and SUBMIT. */
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut', immediateRender: false } });
  t.addLabel('in', 0);
  var F0 = { scale: 1.35, x: -18, y: 0 }, F1 = { scale: 2.05, x: -598, y: 150 }, F2 = { scale: 2.0, x: -80, y: -125 };
  var C1 = 1.517 / F1.scale;
  t.fromTo('#w', F0, { scale: F1.scale, x: F1.x, y: F1.y, duration: 0.8 }, 'in+=0.9');

  t.fromTo('#cur', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: 'none' }, 'in+=3.2');
  t.fromTo('#cur', { x: 858 }, { x: 727, duration: 0.56, ease: 'power2.inOut' }, 'in+=3.2');
  t.fromTo('#cur', { y: 558 }, { y: 384, duration: 0.5, ease: 'power3.out' }, 'in+=3.2');
  t.fromTo('#hP', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: 'none' }, 'in+=3.76');
  t.fromTo('#cur', { scale: C1 }, { scale: C1 * 0.88, duration: 0.08, ease: 'power1.inOut', yoyo: true, repeat: 1 }, 'in+=4.0');
  t.fromTo('#s03', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.12, ease: 'power1.inOut' }, 'in+=4.0');
  t.fromTo('#cur', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.25, ease: 'power1.in' }, 'in+=4.05');
  t.fromTo('#w', { scale: F1.scale, x: F1.x, y: F1.y }, { scale: F2.scale, x: F2.x, y: F2.y, duration: 0.6 }, 'in+=4.0');

  window.__timelines['dash'] = t;
</script>
</body>
</html>
