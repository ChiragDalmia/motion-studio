<!-- work/relo/alf-walkthrough. Beat ids, starts, tracks and labels come from
     film.json, so a retime is one number there and nothing here moves.
     Every generated file is gitignored: npm run pre writes them. -->

<template data-film>
<style>
  /* The runtime treats the root as a clip too and hides it at t = duration, so
     the film's last frame -- the end frame, with the purchase CTA -- would be a
     black stage the moment playback finishes. The brief needs that CTA on
     screen after playback, so the root is pinned visible. Every other hide the
     runtime does (a beat outside its window) is on the beat's host, not here. */
  #root { visibility: visible !important }

  /* #ui is immune to the camera and carries only the reduced-motion poster. The
     end frame's CTA lives in #type, so #type takes pointer events only there. */
  #ui { pointer-events: none }
  #type { pointer-events: none }

  /* THE END FRAME. A sub-composition is shown for start <= t < end, so the CTA
     cannot live in a beat: it has to be on screen when playback stops at 45.0.
     Main-timeline tweens hold their final state at t = duration, so everything
     below does. Every id is e- prefixed so nothing here can be mistaken for a
     beat's element. #end is the navy ground plus the offer; #returnhost -- the
     return beat itself -- is a sibling AFTER it, so it is on top while the navy
     rises behind it. */
  #end { position: absolute; inset: 0 }
  #e-lock { position: absolute; left: 120px; top: 88px; width: 300px }
  #e-lock svg { display: block; width: 100%; height: auto }
  #e-title { position: absolute; left: 116px; top: 236px; font-size: 84px; line-height: 1.05; color: var(--onGround) }
  #e-reca { position: absolute; left: 118px; top: 352px; font-family: var(--text); font-weight: 500; font-size: 28px; color: var(--brand); margin: 0 }
  /* THREE PURCHASE OPTIONS, all real links. The bundle is one lifted row with
     the accent CTA; the two single courses are quiet rows under a hairline. */
  #e-bundle { position: absolute; left: 820px; top: 392px; width: 1000px; height: 168px; border-radius: 18px; background: rgba(255,255,255,0.07); box-shadow: inset 3px 0 0 var(--brand); font-family: var(--text); color: var(--onGround) }
  #e-bn { position: absolute; left: 36px; top: 30px; font-size: 32px; font-weight: 600; margin: 0 }
  #e-bs { position: absolute; left: 36px; top: 84px; font-size: 23px; font-weight: 500; color: var(--brand); margin: 0 }
  #e-cta { position: absolute; left: 662px; top: 44px; width: 300px; height: 80px; line-height: 80px; text-align: center; border-radius: 10px; background: var(--accent); color: var(--onAccent); font-family: var(--text); font-weight: 600; font-size: 28px; text-decoration: none; transform-origin: 50% 50%; pointer-events: auto }
  #e-cta:focus-visible, .e-alt a:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px }
  .e-alt { position: absolute; left: 820px; width: 1000px; height: 84px; font-family: var(--text); color: var(--onGround); border-top: 1px solid rgba(255,255,255,0.16) }
  #e-a1 { top: 596px } #e-a2 { top: 692px }
  .e-alt .n { position: absolute; left: 36px; top: 24px; font-size: 26px; font-weight: 500; margin: 0 }
  .e-alt a { position: absolute; left: 700px; top: 22px; font-size: 24px; font-weight: 600; color: var(--brand); text-decoration: none; border-bottom: 2px solid var(--brand); padding-bottom: 4px; pointer-events: auto }
  #e-url { position: absolute; left: 820px; top: 828px; font-family: var(--text); font-weight: 500; font-size: 26px; letter-spacing: 0.02em; color: var(--onGround); margin: 0 }
  /* The desk card IS the return beat, held to the end of the film rather than
     copied into the host. The beat runs 33.5 -> 45; its own 3.5s camera push
     holds its final pose after 37.0, so the card shrink is a transform on this
     host element. No second copy of the artwork, and no cut to hide.

     The runtime hides a clip outside its window by writing visibility:hidden
     inline, and a clip's window is start <= t < end -- so at t = 45.0 exactly,
     the last frame, this beat would be gone. !important outranks that inline
     style, the same guard #root already uses above. Visibility is therefore no
     longer the gate, so opacity is: it is 0 in the markup and the main timeline
     turns it on at 33.5. Extending the beat past 45 instead would work too, and
     is wrong -- it makes getDuration() 45.1 against an authored 45. */
  #returnhost { left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; box-shadow: 0 24px 60px rgba(0,0,0,0.28); visibility: visible !important; opacity: 0 }
  .hid { opacity: 0; visibility: hidden }

  /* Reduced motion: the film is replaced by one still -- product, offer and a
     working CTA -- in #ui. Static CSS, no script, so the render (which never
     asks for reduced motion) is unaffected and the timeline stays untouched. */
  #poster { display: none; position: absolute; inset: 0; background: var(--navy); color: #ffffff; pointer-events: auto }
  #poster .shot { position: absolute; left: 960px; top: 120px; width: 840px; height: 525px; background: var(--img-v01-small) 0 0 / 100% 100% no-repeat; border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,0.3) }
  #poster h2 { position: absolute; left: 120px; top: 120px; width: 780px; font-size: 84px; line-height: 1.05; color: #ffffff }
  #poster .sub { position: absolute; left: 120px; top: 420px; width: 780px; font-family: var(--text); font-weight: 500; font-size: 32px; line-height: 1.4; color: #ffffff; margin: 0 }
  #poster a { position: absolute; left: 120px; top: 620px; padding: 0 44px; height: 76px; line-height: 76px; border-radius: 10px; background: var(--accent); color: var(--onAccent); font-family: var(--text); font-weight: 600; font-size: 30px; text-decoration: none }
  #poster .url { position: absolute; left: 120px; top: 740px; font-family: var(--text); font-weight: 500; font-size: 26px; color: #ffffff; margin: 0 }
  @media (prefers-reduced-motion: reduce) {
    #art, #type { visibility: hidden }
    #poster { display: block }
  }
</style>
<script>
  /* The intro's push, unchanged from brand-logo: 1.06 -> 1.0 over the sting,
     down-left to up-right, WITH the mark's rising diagonal. It ends neutral at
     2.0, and #cam is never touched again: every later reframe is a world
     transform inside its own beat, so the editorial layer above never scales. */
  tl.fromTo('#cam', camera(1.06, -0.02, 0.01), { scale: 1, xPercent: 0, yPercent: 0, duration: 2, ease: 'power1.out' }, 'intro');

  /* THE END FRAME, film 43.5 -> 44.3. The return beat, still on screen and
     holding its final pose -- the learner looking up at you -- moves left and
     down into a 600px card while the navy rises behind it; lockup, title,
     courses, offer and CTA arrive in that order and everything is still by 44.3.
     Held to 51.5, and at 51.5, because these are main-timeline tweens at their
     end state, the frame and its CTA stay. */
  /* The beat's own gate: opacity, because its visibility is pinned (see above).
     A switch, not a move -- the cut from the portrait at 40.0 is a cut -- so it
     is 20 milliseconds and the curve on it cannot be seen. It has to FINISH on
     the frame the beat starts, not start there: a tween renders its from-state
     at its own start time, so gating exactly at 40.0 left t = 40.0 -- a frame
     the render will ask for -- with the portrait already hidden by the runtime
     and this still at zero, which is a white flash. It holds on to 51.5.
     4 milliseconds, not 20: for the length of the switch the desk is partly
     transparent OVER the portrait that is still on screen, and 20ms is a frame
     at 50fps. At 4 it is under a frame at any rate a film is rendered at, so
     every frame the render asks for is either all portrait or all desk. */
  tl.fromTo('#returnhost', { opacity: 0 }, { opacity: 1, duration: 0.004, ease: 'power1.out', immediateRender: false }, 'return-=0.004');
  /* The navy starts 0.15s early and takes 0.35s, so it is fully up by 43.7 while
     the desk still covers all but a sliver of the frame. Fading it on the same
     frame the shrink starts left the vacated edge showing the host's white
     ground through a half-transparent navy -- a bright band chasing the card
     down and to the right. Early is free: until 43.5 an opaque full-frame desk
     is on top of it, so nothing of the navy can be seen arriving. */
  tl.fromTo('#end', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: 'power2.inOut', immediateRender: false }, 'close-=0.15');
  /* power2.inOut over 0.7s, not power3 over 0.6: same reason as the dive into
     the laptop -- power3's peak is twice as fast for the same distance and has
     to shed all of it at the end, and on a 3.2x reduction that reads as the card
     hitting a stop. Both ends are still: the beat's own push has finished at
     43.5 and nothing moves after 44.2. */
  tl.fromTo('#returnhost', { scale: 1, x: 0, y: 0, borderRadius: '0px' }, { scale: 0.3125, x: 120, y: 440, borderRadius: '64px', duration: 0.7, ease: 'power2.inOut', immediateRender: false }, 'close');
  tl.fromTo('#e-lock', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, immediateRender: false }, 'close+=0.35');
  tl.fromTo('#e-title', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.44, immediateRender: false }, 'close+=0.36');
  tl.fromTo('#e-reca', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.3, immediateRender: false }, 'close+=0.42');
  tl.fromTo('#e-bundle', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.34, immediateRender: false }, 'close+=0.48');
  tl.fromTo('#e-cta', { scale: 0.96 }, { scale: 1, duration: 0.3, ease: 'back.out(1.4)', immediateRender: false }, 'close+=0.56');
  tl.fromTo('#e-a1', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, immediateRender: false }, 'close+=0.6');
  tl.fromTo('#e-a2', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, immediateRender: false }, 'close+=0.66');
  tl.fromTo('#e-url', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, immediateRender: false }, 'close+=0.72');

  /* Both purchase links. The build's self-containment guard rejects any
     absolute href in the markup because it cannot tell navigation from a
     resource; a link fetches nothing until it is clicked, so the URL travels
     as data-go and is put on each anchor here, once, at load. Same flow. */
  var ctas = document.querySelectorAll('[data-go]');
  for (var i = 0; i < ctas.length; i++) ctas[i].setAttribute('href', ctas[i].getAttribute('data-go'));
</script>
</template>

<template data-beat="desk">
<style>
  /* The default surface: the host paints var(--ground) and this beat paints its
     own room inside the SVG, which is the relo.html artwork, unaltered. The
     trace is one flat stack of colour layers, so tmp/seg.py recovers the objects
     from it and tmp/build_scene.py stamps them here as <g> per object; nothing
     is redrawn and paint order inside a group is the tracer's own. */
  #root { overflow: hidden }
  /* The world is the whole desk, scaled about its own top-left so the camera
     maths below stays a plain affine map from world to frame. */
  #stage { position: absolute; inset: 0; overflow: hidden }
  #w { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0 }
  /* The artwork is 1672x941, the frame 1920x1080: the same aspect to within half
     a pixel, so `slice` fills the frame and crops 0.3px top and bottom. */
  /* Pre-roll lives in the markup, not in the tweens: every tween here is
     immediateRender:false, so a from-state that is not written down does not
     exist until its tween starts. The scene's own opacity is the only fade in
     the reveal -- see the script. */
  #d-scene { position: absolute; left: 0; top: 0; display: block }
  #d-title, #d-rule { opacity: 0 }

  /* THE SCREEN. The lid carries the real product capture, as it does in every
     beat of this film; the artwork's own traced dashboard is not stamped. The
     aperture is a perspective quad -- measured off the artwork at art
     (1071.1,386.5) (1531.1,386.5) (1493.6,731) (1028.4,704.3) -- and one skewX
     lays the capture into it. The clip is that quad expressed BEFORE the skew
     (clip-path is applied in the element's own space, then transformed) and
     3px proud on every side, so the capture reaches under the bezel rather
     than leaving a sliver of wall at the edge. The capture keeps its own 1.6
     aspect and the lid's page grey fills the last sixth of the drawn screen,
     which is deeper than the capture -- distorting the product to fit would be
     worse. As the push flattens the skew to zero the clip flattens with it,
     ending wider than the frame, and the capture lands 1920 wide with its
     top-left on the frame's: the frame dash.html opens on, to the pixel. */
  #d-lid { position: absolute; left: 1229.88px; top: 443.83px; width: 528.23px; height: 400px;
           transform-origin: 0 0; transform: skewX(-6.923deg); background: #f4f6f9;
           clip-path: polygon(-3px -3px, 531.2px -3px, 536.2px 398.6px, -7.8px 367.9px) }
  /* The capture is a 1600x1000 box scaled down, not a small box with a stretched
     background, because 3.6348181 * 0.3301435 = 1.2 -- the exact scale dash.html
     holds its own 1600x1000 box at. Same box, same factor, same resampling, so
     the cut at 8.0 does not change the sharpness of a single glyph. */
  #d-shot { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px;
            transform-origin: 0 0; transform: scale(0.3301435);
            background: var(--img-v01) 0 0 / 100% 100% no-repeat }
  /* WHY THESE ARE PROMOTED. There is no playback: every frame is a fresh seek,
     and this beat is one <svg> of 693 traced paths. A change to #w's transform
     -- the push, then the dive -- or to any group's transform attribute
     invalidates the whole scene, and Chrome re-rasterizes all 693 paths for the
     frame. Measured on the shipped bytes: 124 ms per presented frame, 8 fps,
     against 17 ms everywhere else in the film. will-change gives the scene and
     each animated group its own composited layer, so the camera composites a
     cached raster instead of re-rastering it, and a group's own move damages
     only its own layer. Measured after: 17 ms, 59 fps, and every frame is
     pixel-identical -- #d-lid and #d-shot are deliberately NOT promoted, so the
     product capture keeps re-rastering at the true scale and the cut at 8.0
     still does not change the sharpness of a glyph.
     Not #d-rule and not the lids: their transforms pass through scale 0, and a
     degenerate layer is not worth 16 paths and 1 path. */
  #d-scene, #d-figure, #d-headg, #d-hand, #d-pen, #d-title,
  #d-plant, #d-mug, #d-books, #d-cal, #d-laptop, #d-notebook,
  #d-brow, #d-mouth, #d-gaze { will-change: transform }
</style>
  <div id="stage" class="clip" data-start="0" data-duration="6" data-track-index="1">
  <div id="w" data-layout-allow-overflow>
<!--include desk-scene-->
    <div id="d-lid"><div id="d-shot" role="img" aria-label="RELO dashboard, day one"></div></div>
  </div>
  </div>
<script>
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut', immediateRender: false } });
  t.addLabel('in', 0);

  /* THE REVEAL, 0 -> 1.5, carried entirely by travel. Nothing fades: a trace
     only draws what is visible, so the notebook does not exist under the arms
     and the plant pot does not exist behind the mug -- fading one group would
     show the hole it occupies in the group behind it. So the room is whole at
     the cut (t = 2.0 must be a frame, not a dissolve out of the intro's white)
     and six props settle down onto it in depth order, each exposing nothing
     but the desk. The learner does not travel, for the reason above. */
  var DOWN = { attr: { transform: 'translate(0 18)' } };
  var SET = { attr: { transform: 'translate(0 0)' }, duration: 0.62, ease: 'power3.out' };
  t.fromTo('#d-plant', DOWN, SET, 'in+=0.02');
