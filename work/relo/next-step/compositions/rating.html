<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  #root { position: relative; background: transparent; overflow: hidden }
  /* #stage is the timed element and never leaves the frame; #w is the zoomed
     capture space inside it. This beat opens on the frame quiz.html ends on --
     the Study Navigator at 2.0, reading 12 / 20 -- so that framing is the
     markup's own transform, and the beat's first move is the pan down the card
     stack to ReadyRating. */
  #stage { position: absolute; inset: 0; overflow: hidden }
  #w { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; overflow: hidden; transform-origin: 0 0; transform: translate(189px, 212px) scale(2); border-radius: 6px; box-shadow: 0 18px 50px rgba(5,16,71,0.14) }
  .shot { position: absolute; background-repeat: no-repeat; background-size: 100% 100% }
  .base { left: 0; top: 0; width: 1600px; height: 1000px }
  .hid { opacity: 0; visibility: hidden }
  /* Day one plus the rectangle the practice set changed; see quiz.html. */
  #v07 { background-image: var(--img-v01) }
  #d07 { left: 80px; top: 348px; width: 612px; height: 174px; background-image: var(--img-d07) }
  /* ReadyRating's header with its hover, and the expanded card twice: with the
     header still hovered (the pointer is on it when it opens) and at rest. The
     expanded crop includes the card's shadow, so it covers the collapsed one.
     The opening one starts fully clipped and is revealed top-down. */
  #rH { left: 79px; top: 436px; width: 614px; height: 80px; background-image: var(--img-rr-down-hover) }
  .open { left: 79px; top: 436px; width: 614px; height: 190px }
  #rOH { background-image: var(--img-rr-open-hover); clip-path: inset(0 0 100% 0) }
  #rO { background-image: var(--img-rr-open) }
  #cur { position: absolute; left: 0; top: 0; width: 20px; height: 29px; transform-origin: 2px 2px; transform: translate(700px, 620px) scale(0.7984); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)) }
</style>
</head>
<body>
<div id="root" data-composition-id="rating" data-width="1920" data-height="1080" data-duration="5">
  <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="1">
    <div id="w" data-layout-allow-overflow>
      <div id="v07" class="shot base" aria-hidden="true"></div>
      <div id="d07" class="shot" role="img" aria-label="RELO dashboard after the practice set: 12 of 20 questions, with the ReadyRating panel collapsed"></div>
      <div id="rH" class="shot hid"></div>
      <div id="rOH" class="shot open hid"></div>
      <div id="rO" class="shot open hid" role="img" aria-label="ReadyRating, readiness to pass the exam: level 1 of 5. Not ready yet, but you'll get there!"></div>
      <svg id="cur" class="hid" viewBox="0 0 20 29" aria-hidden="true"><path d="M1.6 1.2 L1.6 24.3 L7.3 18.8 L11 27.4 L14.6 25.8 L11 17.4 L18.6 17 Z" fill="#111" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>
<script>
  /* Film 30.0: no cut to hide -- this beat opens on the frame quiz.html held, on
     the same dashboard, and the camera keeps moving: 30.15 -> 31.05 down the
     card stack from the Study Navigator to ReadyRating, widening a little as it
     goes. Pointer in at 30.5, 30.75 -> 31.25 to the card's expansion control,
     250ms dwell on its real hover state, click 31.55: the card's own expansion
     is the movement, revealed top-down over 280ms. The framing is set so the
     card the click is about to grow ends up filling the bottom of the frame
     rather than floating over empty page -- it is the last card in that column,
     and there is nothing under it to look at -- with the Study Navigator above
     holding the top. 31.65 -> 32.4 the camera settles 35px onto it; the pointer
     leaves and the header's hover ends. Then the product's own words hold to 35.0. Initial
     states are markup. */
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut', immediateRender: false } });
  t.addLabel('in', 0);
  var FN = { scale: 2.0, x: 189, y: 212 }, F4 = { scale: 1.9, x: 227.5, y: -170 };
  var C = 1.517 / F4.scale;
  t.fromTo('#w', FN, { scale: F4.scale, x: F4.x, y: F4.y, duration: 0.9, ease: 'power2.inOut' }, 'in+=0.15');

  t.fromTo('#cur', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.22, ease: 'power1.out' }, 'in+=0.5');
  t.fromTo('#cur', { x: 700 }, { x: 650, duration: 0.5, ease: 'power2.inOut' }, 'in+=0.75');
  t.fromTo('#cur', { y: 620 }, { y: 473, duration: 0.46, ease: 'power3.out' }, 'in+=0.75');
  t.fromTo('#rH', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: 'none' }, 'in+=1.3');
  /* Click 31.55. */
  t.fromTo('#cur', { scale: C }, { scale: C * 0.88, duration: 0.08, ease: 'power1.inOut', yoyo: true, repeat: 1 }, 'in+=1.55');
  t.fromTo('#rOH', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.04, ease: 'none' }, 'in+=1.55');
  t.fromTo('#rOH', { clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)', duration: 0.28, ease: 'power2.out' }, 'in+=1.55');
  t.fromTo('#w', { y: F4.y }, { y: F4.y - 35, duration: 0.75 }, 'in+=1.65');
  /* The pointer steps off the header and fades; the header's hover goes with it. */
  t.fromTo('#cur', { x: 650, y: 473 }, { x: 700, y: 640, duration: 0.5 }, 'in+=1.9');
  t.fromTo('#cur', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.35, ease: 'power1.in' }, 'in+=2.1');
  t.fromTo('#rO', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.12, ease: 'none' }, 'in+=1.96');
  t.fromTo(['#rOH', '#rH'], { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.12, ease: 'none' }, 'in+=1.96');

  window.__timelines['rating'] = t;
</script>
</body>
</html>
