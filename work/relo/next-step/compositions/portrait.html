<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  /* Navy surface, stated. #root is transparent and #bg carries the ground so
     the navy can rise over the dashboard during the 0.2s this beat overlaps the
     one before it. */
  #root { position: relative; background: transparent; overflow: hidden }
  #bg { position: absolute; inset: 0; background: var(--ground); opacity: 0; visibility: hidden }
  .hid { opacity: 0; visibility: hidden }
  /* The photograph's frame starts as the ReadyRating card's rectangle in the
     previous frame -- (468,358) 984x323 -- and resolves to a 520px square at
     (300,260). Position is a transform (x,y from that origin); only the box's
     size is a layout tween, and the photo is a cover background, so the move is
     a gentle crop adjustment and nothing on the face is animated. */
  #pf { position: absolute; left: 378px; top: 623px; width: 1167px; height: 361px; overflow: hidden; border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,0.30) }
  #photo { position: absolute; inset: 0; background: var(--img-angela) 50% 28% / cover no-repeat }
  /* Type arrives by opacity and a 12px rise, not a wipe: a wipe over an opaque
     ground reads to the occlusion audit as text hidden under the ground. */
  #h { position: absolute; left: 900px; top: 300px; font-family: var(--display); font-weight: 700; font-size: 96px; line-height: 1.05; letter-spacing: -0.02em; color: var(--onGround); margin: 0 }
  #nm { position: absolute; left: 900px; top: 470px; font-family: var(--text); font-weight: 600; font-size: 44px; line-height: 1.2; color: var(--onGround); margin: 0 }
  #rl { position: absolute; left: 900px; top: 536px; font-family: var(--text); font-weight: 500; font-size: 30px; line-height: 1.3; color: var(--brand); margin: 0 }
</style>
</head>
<body>
<div id="root" class="s-navy" data-composition-id="portrait" data-width="1920" data-height="1080" data-duration="5.2">
  <div id="bg" class="clip" data-start="0" data-duration="5.2" data-track-index="1"></div>
  <div id="pf" class="clip hid" data-start="0" data-duration="5.2" data-track-index="2"><div id="photo" role="img" aria-label="Angela Detmold"></div></div>
  <h2 id="h" class="clip hid" data-start="0" data-duration="5.2" data-track-index="3">Live Office Hours</h2>
  <p id="nm" class="clip hid" data-start="0" data-duration="5.2" data-track-index="4">Angela Detmold</p>
  <p id="rl" class="clip hid" data-start="0" data-duration="5.2" data-track-index="4">Senior Industry Advisor, Real Estate</p>
</div>
<script>
  /* Film 34.8 -> 40.0. The navy and the photograph arrive together over the
     open ReadyRating card (34.8 -> 35.2); the frame moves to its portrait
     position 35.05 -> 35.85; headline at 35.4, name and role 180ms after. Hold. */
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power3.out', immediateRender: false } });
  t.addLabel('in', 0);
  t.fromTo('#bg', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.16, ease: 'power2.out' }, 'in');
  t.fromTo('#pf', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.16, ease: 'power1.inOut' }, 'in+=0.16');
  t.fromTo('#pf', { x: 0, y: 0, width: 1167, height: 361, borderRadius: 8 }, { x: -78, y: -363, width: 520, height: 520, borderRadius: 16, duration: 0.8, ease: 'power3.inOut' }, 'in+=0.25');
  t.fromTo('#h', { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.44 }, 'in+=0.6');
  t.fromTo('#nm', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.36 }, 'in+=0.78');
  t.fromTo('#rl', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.36 }, 'in+=0.78');
  window.__timelines['portrait'] = t;
</script>
</body>
</html>
