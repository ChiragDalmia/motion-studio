<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  /* The editorial layer: three lines, each in its own window, hosted in #type so
     the camera can never scale them. Default surface: navy ink on the host's
     white and on the desk's warm wall, both of which it clears. */
  #root { position: relative; background: transparent }
  .line { position: absolute; font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; color: var(--onGround); margin: 0; clip-path: inset(0 100% 0 0) }
  /* In the white band the product frame leaves above itself. */
  #n { left: 96px; top: 40px; font-size: 84px; line-height: 1.1 }
  #u { left: 96px; top: 52px; font-size: 56px; line-height: 1.1 }
  /* Two lines: the learner's head reaches x 653 in the return beat's artwork,
     and one line of this at 84px would run under the hair. */
  #c { left: 96px; top: 60px; font-size: 84px; line-height: 1.06 }
</style>
</head>
<body>
<div id="root" data-composition-id="copy" data-width="1920" data-height="1080" data-duration="49.5">
  <h2 id="n" class="line clip" data-start="7"    data-duration="5.2" data-track-index="2">Your next step.</h2>
  <h2 id="u" class="line clip" data-start="20.2" data-duration="3.7" data-track-index="3">Understand why.</h2>
  <h2 id="c" class="line clip" data-start="37.9" data-duration="4.1" data-track-index="4">A clearer way<br>forward.</h2>
</div>
<script>
  /* Times are beat-relative; the beat starts at film 0:02.00. Each line wipes in
     over one pack beat and fades before the frame it sits in changes under it:
     the next-step line carries the dashboard AND the lesson it sends the learner
     to, and goes as the player settles; "Understand why." goes before PROCEED
     scores the set; and the last line goes before the desk shrinks into the end
     frame. The opening question is NOT here: "Am I ready?" and its rule are
     drawn into the desk artwork, so the desk beat animates them and the camera
     scales them with the room they belong to. */
  /* The fade-outs render at construction, unlike every other tween here. With
     immediateRender:false a fromTo never writes its start value until the
     playhead reaches it, so once a line had faded, seeking BACK to before the
     fade left it at opacity 0 -- the line simply did not come back. Rendering
     the start state at build fixes the rewind; it is harmless forward, because
     .line is clipped to zero width until its own wipe runs. */
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power4.out', immediateRender: false } });
  t.addLabel('in', 0);
  t.fromTo('#n', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.52 }, 'in+=7.5');
  t.fromTo('#n', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in', immediateRender: true }, 'in+=11.5');
  t.fromTo('#u', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.44 }, 'in+=20.7');
  t.fromTo('#u', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in', immediateRender: true }, 'in+=23.1');
  t.fromTo('#c', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.52 }, 'in+=38.4');
  t.fromTo('#c', { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power1.in', immediateRender: true }, 'in+=41.2');
  window.__timelines['copy'] = t;
</script>
</body>
</html>
