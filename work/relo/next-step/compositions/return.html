<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0 }
  /* Same room and same artwork as desk.html, stamped by tmp/build_scene.py with
     an r- prefix so no id collides once the packager inlines both beats into one
     document. Two differences, both story: the opening question is gone -- the
     editorial layer is on "A clearer way forward." here -- and the laptop shows
     the real product rather than the artwork's drawn one, so the traced screen
     is not stamped at all. This beat is also the end frame's card: it runs to
     the end of the film and the host shrinks it, so the artwork ships once. */
  /* Both are pinned visible: the runtime hides a clip at t = its end, and this
     beat has to survive the film's last frame because the host shrinks it into
     the end frame's card. The host gates the whole beat on opacity instead. */
  #root { position: relative; background: transparent; overflow: hidden; visibility: visible !important }
  #stage { position: absolute; inset: 0; overflow: hidden; visibility: visible !important }
  #w { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0 }
  #r-back, #r-front { position: absolute; left: 0; top: 0; display: block }
  /* The capture sits BETWEEN the two halves of the scene -- everything behind
     the laptop, then this, then the laptop itself -- so the lid's own bezel
     masks it and the fit into the aperture needs no clip path. It is drawn a
     little larger than the aperture on every side for exactly that reason. */
  #r-lid { position: absolute; left: 1224px; top: 441px; width: 545px; height: 340.6px;
           transform-origin: 0 0; transform: skewX(-6.923deg) scaleY(1.2);
           background: var(--img-v01-small) 0 0 / 100% 100% no-repeat }
</style>
</head>

<script>
  var t = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut', immediateRender: false } });
  t.addLabel('in', 0);

  /* Film 40.0 -> 51.5. The camera does the handing back: one slow push,
     1 -> 1.03 about (760,420), the learner's shoulders and face, ending at 43.5
     -- the frame the host shrinks into the end card. A tween at its end state
     holds, so the pose is still from 43.5 on and the artwork ships once.
     The learner is alive under it and does almost nothing: one breath, one
     blink, and then -- at 42.35, a second before the room becomes a card -- he
     stops, looks up out of the frame at you, and smiles. */
  /* sine.inOut, not sine.out: the portrait before this is dead still for four
     seconds, and sine.out starts at its fastest, so the cut used to hand a
     frozen frame straight to a moving one. Starting from rest matches the frame
     it cuts from, and it still arrives at rest for the card shrink at 43.5. */
  t.fromTo('#w', { scale: 1, x: 0, y: 0 }, { scale: 1.03, x: -22.8, y: -12.6, duration: 3.5, ease: 'sine.inOut' }, 'in');

  /* One breath, in and out, and then the chest is still: yoyo returns the group
     to the from-state, so there is nothing left running when he looks up. */
  t.fromTo('#r-figure', { attr: { transform: 'translate(700 900) scale(1 1) translate(-700 -900)' } }, { attr: { transform: 'translate(700 900) scale(1 1.0022) translate(-700 -900)' }, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 'in+=0.2');

  /* The lids are the only geometry here the tracer did not draw; see
     tmp/build_scene.py. 80ms shut, 80ms open. The second one rides the turn,
     which is where a person blinks. */
  function lid(id, y) {
    var a = 'translate(0 ' + y + ') scale(1 ', b = ') translate(0 -' + y + ')';
    return [id, { attr: { transform: a + '0' + b } }, { attr: { transform: a + '1' + b }, duration: 0.08, ease: 'sine.inOut', yoyo: true, repeat: 1 }];
  }
  var LL = lid('#r-lidL', 196), LR = lid('#r-lidR', 208);
  t.fromTo(LL[0], LL[1], LL[2], 'in+=0.90');
  t.fromTo(LR[0], LR[1], LR[2], 'in+=0.90');
  t.fromTo(LL[0], LL[1], LL[2], 'in+=2.40');
  t.fromTo(LR[0], LR[1], LR[2], 'in+=2.40');

  /* TO CAMERA, 42.35 -> 43.32. The irises lead by 70ms and the head follows,
     which is the order a real look happens in; the head turns 1.6 degrees about
     the neck at (706,425), which is as far as a drawn three-quarter head can go
     before the collar reads as a seam. The mouth is a separate group with the
     skin it was cut out of left behind it, so the smile is the artwork's own
     lips, 3% wider and a pixel higher -- no new mouth, and no hole. Then
     nothing moves again. */
  t.fromTo('#r-gaze', { attr: { transform: 'translate(0 0)' } }, { attr: { transform: 'translate(-1.7 0.5)' }, duration: 0.55, ease: 'power2.inOut' }, 'in+=2.35');
  t.fromTo('#r-headg', { attr: { transform: 'rotate(0 706 425)' } }, { attr: { transform: 'rotate(-1.6 706 425)' }, duration: 0.8, ease: 'power2.inOut' }, 'in+=2.42');
  t.fromTo('#r-mouth', { attr: { transform: 'translate(723 292) scale(1 1) translate(-723 -292)' } }, { attr: { transform: 'translate(723 292) scale(1.03 0.98) translate(-723 -292) translate(0 -1.1)' }, duration: 0.6, ease: 'power2.out' }, 'in+=2.72');

  window.__timelines['return'] = t;
</script>
