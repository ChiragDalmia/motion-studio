name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Three operating systems, because the product is bytes that have to come out
  # identical everywhere, and "it works on my machine" is what that claim is
  # most exposed to. Node only; no browser.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run doctor
      - run: npm run lint

      # Build, wipe the generated workspace, regenerate from the three tracked
      # files, build again, compare. This is the one thing a single machine
      # cannot prove about a clean clone.
      - run: node tools/do.mjs repro

      - name: generation left no git changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generating the workspace changed tracked files"
            git status --short
            exit 1
          fi

  # Gate 1 and gate 2 need a real browser, and the heaviest film takes a
  # quarter of an hour. One platform is enough: these validate the film, and
  # the matrix above is what validates the platforms.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history, because the selection below diffs against the base and a
      # shallow clone has nothing to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright-core install --with-deps chromium

      # Only the films this change can reach, so one film is one film of gate
      # time instead of all of them. do.mjs widens the selection to every film
      # when lib/ or tools/ moves, and an unresolvable ref widens it too, so
      # the way this fails is "gate everything", never "gate nothing".
      - name: gate 1 and gate 2, the films this change can reach
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || github.event.before }}
        run: |
          node tools/do.mjs list --since "$BASE" | while read -r id; do
            npm run ship "${id%%/*}" "${id##*/}"
          done
