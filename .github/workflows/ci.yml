name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are noise and burn a runner for nothing. The newest push to a
# ref is the only one whose answer anybody wants.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast signal, and the only one on the critical path. Three operating
  # systems, because the product is bytes that have to come out identical
  # everywhere, and "it works on my machine" is what that claim is most exposed
  # to. Node only; no browser, so the whole matrix lands inside a minute.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run doctor
      - run: npm run lint

      # Build, wipe the generated workspace, regenerate from the three tracked
      # files, build again, compare. This is the one thing a single machine
      # cannot prove about a clean clone.
      - run: node tools/do.mjs repro

      - name: generation left no git changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generating the workspace changed tracked files"
            git status --short
            exit 1
          fi
