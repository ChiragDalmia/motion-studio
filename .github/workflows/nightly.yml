name: nightly

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tier 3: every film, with snapshots and the motion audit, which roughly
  # doubles a check run. This is where the whole guarantee gets exercised
  # without anybody sitting and waiting for it.
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node tools/do.mjs all
