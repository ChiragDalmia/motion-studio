<!doctype html>
<!--TEMPLATE
     Stamped by tools/new.mjs, which replaces the __PLACEHOLDERS__ with the
     brand's resolved declaration and strips this block. It is not an include:
     a composition has no module system, so the world and its pan clamp are
     inline in every film by design. One authored copy per film, so a human
     editing it in Studio keeps their edits.
-->
<!-- The four layers are fixed and the order is the law:
       #art    camera-scaled. Everything photographic or illustrative.
       #type   translate-only, NEVER scaled. Display type stays sharp.
       #ui     immune to the camera. Chrome, rules, marks that must not move.
       #grade  static. Grain, vignette, LUT target. Never animated. -->
<html lang="en" data-composition-variables='__VARS__'>
<head>
<meta charset="utf-8">
<title>__NAME__</title>
<script src="gsap.min.js"></script>
<link rel="stylesheet" href="brand.css">
<style>
  body { margin: 0; background: var(--ground) }

  #root {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: var(--ground);
    color: var(--onGround);
    font-family: var(--text);
  }

  /* The layers. Nothing else may be a direct child of #root except a
     sub-composition host and timed media. */
  #art, #type, #ui, #grade { position: absolute; inset: 0 }
  #art   { z-index: 10 }
  #type  { z-index: 20 }
  #ui    { z-index: 30 }
  #grade { z-index: 40; pointer-events: none }

  /* The camera lives on #art only. transform-origin is the frame centre so a
     push reads as a push and not as a corner zoom. */
  #cam { position: absolute; inset: 0; transform-origin: 50% 50% }

  .clip { position: absolute }

  h1, h2, .display { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; margin: 0 }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="__DURATION__">

  <div id="art"><div id="cam"></div></div>
  <div id="type"></div>
  <div id="ui"></div>
  <div id="grade"></div>

</div>

<script>
  /* The camera clamp. Panning a layer scaled by s about its centre: a pre-scale
     translate of X px moves content by s*X px, and the overhang available on
     each side is (s*W - W)/2. So the largest safe translate, as a fraction of
     the layer box, is (s - 1) / (2 * s) — and it is ZERO whenever s <= 1,
     because a world smaller than the frame has nothing to pan into. Getting
     that second case wrong is how a pan reveals the page behind the film. */
  function panLimit(s) {
    return s <= 1 ? 0 : (s - 1) / (2 * s);
  }
  function pan(x, y, s) {
    var m = panLimit(s);
    return {
      x: Math.min(m, Math.max(-m, x)),
      y: Math.min(m, Math.max(-m, y)),
    };
  }
  /* Set the camera. x and y are fractions of the frame, clamped for you. */
  function camera(s, x, y) {
    var p = pan(x || 0, y || 0, s);
    return { scale: s, xPercent: p.x * 100, yPercent: p.y * 100 };
  }

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  window.__timelines['main'] = tl;
</script>
</body>
</html>
